<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 — Page Not Found | Aurora Group</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <script>
    (function () {
      var p = location.pathname;
      if (/^\/(ar\/)?(brief|projects|team)\/[^\/]+\/?$/.test(p)) {
        location.replace('/?__p=' + encodeURIComponent(p + location.search) + location.hash);
      }
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at 18% 25%, rgba(106, 0, 244, 0.35) 0%, transparent 50%),
                  radial-gradient(circle at 82% 28%, rgba(0, 255, 192, 0.18) 0%, transparent 45%),
                  #0A0F33;
      color: #F5F6FC;
      text-align: center;
    }
    .card {
      max-width: 520px;
      width: 100%;
      padding: 48px 36px;
      border-radius: 16px;
      background: rgba(18, 23, 46, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    .eyebrow {
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #00FFC6;
      margin-bottom: 12px;
    }
    h1 {
      font-size: clamp(2.8rem, 7vw, 4.2rem);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin-bottom: 14px;
    }
    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #B8BCD6;
      margin-bottom: 28px;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 26px;
      border-radius: 10px;
      background: #00FFC6;
      color: #0A0F33;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      transition: transform 0.16s ease, opacity 0.16s ease;
    }
    a.btn:hover { transform: translateY(-1px); opacity: 0.94; }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Aurora Group · Error 404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for doesn’t exist or may have moved. Return to Aurora Group’s homepage to explore our work and services.</p>
    <a class="btn" href="/">← Back to Home</a>
  </main>
</body>
</html>
